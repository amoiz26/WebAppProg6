<!DOCTYPE html>
<html>
 
<head>
    <title>Actors</title>
</head>

<body>

<h2>Actors by Abdul Moiz</h2>

<form>
    <label for="actor">Peter Pan</label>
    <input type="password" id="actor" value="Robin Williams"> <br>

    <label for="guess">Who is the actor</label>
    <input type="text" id="guess"> <br>

    <input type="button" onclick="checkActor()" value="Check the guess">
</form>


<p id="result">Correct: 0, Not Correct: 0</p>

<script>
    let correct = 0;
    let notCorrect = 0;

    function checkActor() {
        let actor = document.getElementById("actor").value;
        let guess = document.getElementById("guess").value;

        if (actor == guess) {
            correct = correct + 1;
            alert("That's right");
        } else {
            notCorrect = notCorrect + 1;
            alert("Better luck next time");
        }

        document.getElementById("result").innerHTML =
            "Correct: " + correct + ", Not Correct: " + notCorrect;
    }
</script>

</body>
</html>
