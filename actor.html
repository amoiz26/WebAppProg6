<!DOCTYPE html>
<html>
 
<head>
    <title>Actors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h2>Actors by Abdul Moiz</h2>

<form>
    <label for="actor">Peter Pan</label>
    <input type="password" class="form-control" id="actor" value="Robin Williams"><br>

    <label for="guess">Who is the actor</label>
    <input type="text" class="form-control" id="guess"><br>

    <input type="button" id="guessButton" class="btn btn-primary mt-2" onclick="checkActor()" value="Check the guess">
</form>


<p id="result">Correct: 0, Not Correct: 0</p>

<div>
    <img id="foodImage" src="biryani.jpg" width="150" height="150" onclick="updatePic()">
</div>

<script>
    let correct = 0;
    let notCorrect = 0;
    let usePic = 1;

    function checkActor() {
        let actor = document.getElementById("actor").value;
        let guess = document.getElementById("guess").value;

        if (actor == guess) {
            correct = correct + 1;
            alert("That's right");
        } else {
            notCorrect = notCorrect + 1;
            alert("Better luck next time");

            if (notCorrect > 10) {
                document.getElementById("guessButton").setAttribute("onclick", "tooManyWrong()");
            }
        }

        document.getElementById("result").innerHTML =
            "Correct: " + correct + ", Not Correct: " + notCorrect;
    }

    function tooManyWrong() {
        alert("Sorry, too many wrong guesses.");
    }

    function updatePic() {
        switch (usePic) {
            case 1:
                document.getElementById("foodImage").src = "icecream.jpg";
                usePic = 2;
                break;

            case 2:
                document.getElementById("foodImage").src = "macaroni.jpg";
                usePic = 3;
                break;

            case 3:
                document.getElementById("foodImage").src = "biryani.jpg";
                usePic = 1;
                break;
        }
    }
</script>

</body>
</html>
